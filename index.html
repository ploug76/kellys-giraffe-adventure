}

// ===== controls (swipe anywhere to move, JUMP + ACTION right; no on-screen d-pad) =====
const CTL={A:{x:0,y:0,r:0,lbl:'JUMP'},B:{x:0,y:0,r:0,lbl:'ACTION'},mute:{x:0,y:0,w:44,h:44},pause:{x:0,y:0,w:44,h:44}};
function layoutCtl(){
 const top=SAFE.t+8,rgt=W-SAFE.r-8;
 CTL.pause={x:rgt-46,y:top,w:46,h:46};CTL.mute={x:rgt-100,y:top,w:46,h:46};
 if(portrait){
  const cy=gameH+(ctlH-SAFE.b)/2+2;
  const br=clamp(W*0.105,36,46);
  CTL.A={x:W-SAFE.r-14-br,y:cy-br*0.5,r:br,lbl:'JUMP'};
  CTL.B={x:W-SAFE.r-14-br*3.3,y:cy+br*0.45,r:br,lbl:'ACTION'};
 }else{
  const br=clamp(H*0.11,34,46);
  const by=H-SAFE.b-br-12;
  CTL.A={x:W-SAFE.r-16-br,y:by-br*0.8,r:br,lbl:'JUMP'};

 }
}
const KEY={},TOUCH=new Map();let PAD={};
const IN={L:0,R:0,U:0,D:0,J:0,A:0,RAM:0},PREV={...IN},PR={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' ','spacebar'].includes(k))e.preventDefault();
 if(e.repeat){KEY[k]=1;return}KEY[k]=1;AU.unlock();

// touch: JUMP/ACTION on the right; everywhere else is swipe-to-move.
// Swipe and hold: the giraffe moves in the swipe direction while the finger stays down, stops on release.
function zoneAt(x,y){const out={};
 const A=CTL.A,B=CTL.B,da=Math.hypot(x-A.x,y-A.y),db=Math.hypot(x-B.x,y-B.y);
 if(portrait?(x>=W*0.5&&y>gameH-6):(Math.min(da,db)<A.r*1.7)){if(da<db)out.J=1;else out.A=1}
 return out}
const SWIPE_MIN=14;
function swipeDir(dx,dy){const out={};if(Math.hypot(dx,dy)<SWIPE_MIN)return out;const a=Math.atan2(dy,dx),s=Math.round(a/(Math.PI/4));
 if(s===0||s===1||s===-1)out.R=1;if(s===4||s===-4||s===3||s===-3)out.L=1;if(s===2||s===1||s===3)out.D=1;if(s===-2||s===-1||s===-3)out.U=1;
 return out}
function inBtn(r,x,y,p=4){return x>=r.x-p&&x<=r.x+r.w+p&&y>=r.y-p&&y<=r.y+r.h+p}

  const z=zoneAt(x,y);if(Object.keys(z).length)TOUCH.set(id,{x,y,z});else TOUCH.set(id,{x,y,ox:x,oy:y,sw:1,z:{}});return}

function onMove(id,x,y){const t=TOUCH.get(id);if(t){t.x=x;t.y=y;t.z=t.sw?swipeDir(x-t.ox,y-t.oy):zoneAt(x,y)}}
function onUp(id,x,y){AU.unlock();if(TOUCH.has(id)){TOUCH.delete(id);return}

const AU={c:null,g:null,muted:!!save.muted,mt:null,step:0,next:0,theme:0,

  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(this.g);o.start(t);o.stop(t+d+0.02)},

// tiles: # ground  = stone  T tree trunk  - branch (jump up through it)  C cracked rock (NECK RAM it)  ? gem block  B used block  ^ thorns  ~ water
class Builder{constructor(w){this.w=w;this.g=[...Array(ROWS)].map(()=>Array(w).fill('.'));this.o=[]}
 fill(x0,x1,y0,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(x>=0&&x<this.w&&y>=0&&y<ROWS)this.g[y][x]=c}
 ground(x0,x1,top,c='#'){this.fill(x0,x1,top,ROWS-1,c)}
 plat(x0,x1,y,c='-'){this.fill(x0,x1,y,y,c)}
 top(x){for(let y=0;y<ROWS;y++){const c=this.g[y][x];if('#=TC?B-'.includes(c))return y}return ROWS}
 obj(t,x,y,ex){this.o.push(Object.assign({t,x,y},ex||{}))}
 gems(x0,x1,y){for(let x=x0;x<=x1;x++)this.obj('g',x,y)}
 arc(x0,x1,y){const n=x1-x0;for(let x=x0;x<=x1;x++){const k=(x-x0)/Math.max(1,n);this.obj('g',x,y-Math.round(Math.sin(k*Math.PI)*2))}}
 en(t,x,row){this.obj(t,x,row==null?this.top(x)-1:row)}
 sign(x,text){this.obj('S',x,this.top(x)-1,{text})}
 flag(x){this.obj('F',x,this.top(x)-1)}
 goal(x){this.obj('G',x,this.top(x)-1)}
 start(x){this.sx=x}
 hook(x,y){this.obj('H',x,y)}
 water(x0,x1){this.fill(x0,x1,13,14,'~')}
 tree(x,top,h){this.plat(x-h,x+1+h,top,'-');this.fill(x,x+1,top+1,ROWS-1,'T')}
}

 if(dx>0){const cx=Math.floor((o.x+o.w-0.01)/TS);for(let cy=y0;cy<=y1;cy++)if(SOLID.has(T(cx,cy)))hits.push([cx,cy]);if(hits.length)o.x=cx*TS-o.w}
 else if(dx<0){const cx=Math.floor(o.x/TS);for(let cy=y0;cy<=y1;cy++)if(SOLID.has(T(cx,cy)))hits.push([cx,cy]);if(hits.length)o.x=(cx+1)*TS}
 return hits}
function moveY(o,dy){const oldB=o.y+o.h;o.y+=dy;const hits=[];const x0=Math.floor(o.x/TS),x1=Math.floor((o.x+o.w-0.01)/TS);
 if(dy>0){const cy=Math.floor((o.y+o.h-0.01)/TS);for(let cx=x0;cx<=x1;cx++){const t=T(cx,cy);if(SOLID.has(t)||(t==='-'&&oldB<=cy*TS+0.01&&!o.drop))hits.push([cx,cy])}if(hits.length)o.y=cy*TS-o.h}
 else if(dy<0){const cy=Math.floor(o.y/TS);for(let cx=x0;cx<=x1;cx++)if(SOLID.has(T(cx,cy)))hits.push([cx,cy]);if(hits.length)o.y=(cy+1)*TS}
 return hits}

 P={x:sx,y:sy,w:12,h:24,vx:0,vy:0,face:1,ground:false,coyote:0,jbuf:0,st:'n',t:0,inv:0,airRam:true,duck:false,tongue:null,ram:null,swing:null,ledge:null,lastAct:-99,ramCD:0,tcd:0,walk:0,dt:0,safe:{x:sx,y:sy},safeT:0,drop:false};

function setH(h){const p=P;if(p.h===h)return true;const ny=p.y+p.h-h;if(h>p.h&&rectSolid(p.x,ny,p.w,h))return false;p.y=ny;p.h=h;return true}

function headOff(){const p=P;
 if(p.st==='ram'){const r=p.ram;return[4+Math.abs(r.dx)*12,-12+r.dy*12]}
 if(p.st==='ledge'){const l=p.ledge;return[(l.kx-(p.x+p.w/2))*p.face,l.ky-(p.y+p.h)]}
 if(p.st==='swing'){const s=p.swing;return[(s.h.x-(p.x+p.w/2))*p.face,s.h.y-(p.y+p.h)+3]}

 if(p.tongue&&p.tongue.dy<0)return[p.tongue.dx?8:5,-24];

 if(knock){p.vx=(fx==null?-p.face:(p.x+p.w/2<fx?-1:1))*2.2;p.vy=-4}/* knocked AWAY from whatever hit you */AU.sfx('hurt');shake=6;if(G.hp<=0)die()}
function die(){const p=P;p.st='dead';p.vy=-6;p.vx=0;p.dt=0;p.tongue=null;AU.music(false);AU.sfx('die')}

 G.hp=3;const p=P;Object.assign(p,{x:LV.cp.x,y:LV.cp.y,vx:0,vy:0,st:'n',inv:100,h:24,ram:null,swing:null,ledge:null,tongue:null,airRam:true,dt:0});p.safe={x:LV.cp.x,y:LV.cp.y};for(const e of LV.enemies)if(e.alive&&Math.abs(e.x+e.w/2-(p.x+p.w/2))<96){calmAway(e);if(!EDEF[e.type].spiky&&!EDEF[e.type].fly)e.stun=150}
 if(LV.boss&&LV.boss.hp>0){Object.assign(LV.boss,{x:22*TS,y:12*TS-30,vx:0,vy:0,st:'idle',t:0})}LV.rocks=[];AU.music(true,LEVELS[G.lvl].theme)}

 if(G.hp<=0){p.st='dead';p.dt=40;p.vy=0;p.y=LPX+60;AU.music(false);AU.sfx('die');return}
 Object.assign(p,{x:p.safe.x,y:p.safe.y,vx:0,vy:0,st:'n',inv:100,ram:null,swing:null,ledge:null,tongue:null,airRam:true});setH(24)}
function onAction(){const p=P;if(p.st==='dead'||p.st==='win')return;
 const dt=frame-p.lastAct;p.lastAct=frame;
 if(dt<=16&&(p.st==='n'||p.st==='swing')){p.tongue=null;p.lastAct=-99;startRam();return}
 if(p.st!=='n')return;
 if(!p.ground){if(tryHook())return;if(tryLedge())return}
 startTongue()}
function startRam(){const p=P;if(p.ramCD>0||p.st==='dead'||p.st==='ledge')return;if(!p.ground&&!p.airRam&&p.st!=='swing')return;
 let dx=IN.R-IN.L,dy=IN.D-IN.U;if(p.ground&&dy>0)dy=0;if(!dx&&!dy)dx=p.face;const m=Math.hypot(dx,dy);dx/=m;dy/=m;if(dx)p.face=Math.sign(dx);
 p.swing=null;p.tongue=null;setH(24);p.duck=false;p.st='ram';p.ram={dx,dy,t:18};if(!p.ground)p.airRam=false;AU.sfx('ram')}
function tryHook(){const p=P,hx=p.x+p.w/2,hy=p.y+4;let best=null,bd=66;
 for(const h of LV.hooks){if(h.y>hy+10)continue;const d=Math.hypot(h.x-hx,h.y-hy);if(d<bd){bd=d;best=h}}
 if(!best)return false;
 const cx=p.x+p.w/2,cy=p.y+p.h/2;let dx=cx-best.x,dy=Math.max(6,cy-best.y);const L=clamp(Math.hypot(dx,dy),30,52);
 const th=Math.atan2(dx,dy),om=(p.vx*Math.cos(th)-p.vy*Math.sin(th))/L;
 p.st='swing';p.swing={h:best,L,th,om:clamp(om,-0.12,0.12),t:0};p.tongue=null;p.airRam=true;p.duck=false;setH(24);AU.sfx('grab');return true}
function tryLedge(){const p=P;if(p.st!=='n'||p.ground)return false;const f=p.face;
 const cx=f>0?Math.floor((p.x+p.w+3)/TS):Math.floor((p.x-3)/TS);
 for(let cy=Math.floor((p.y-40)/TS);cy<=Math.floor((p.y+p.h-6)/TS);cy++){
  const t=T(cx,cy),up=T(cx,cy-1);if(!(SOLID.has(t)||t==='-'))continue;if(SOLID.has(up)||up==='-')continue;
  const ky=cy*TS;if(ky<p.y-40||ky>p.y+p.h-6)continue;
  const tx=f>0?cx*TS+1:cx*TS+TS-1-p.w,ty=ky-24;if(rectSolid(tx,ty,p.w,24)||rectSolid(p.x,ty,p.w,24))continue;
  p.st='ledge';p.ledge={sx:p.x,sy:p.y,tx,ty,t:0,kx:f>0?cx*TS+2:cx*TS+TS-2,ky};p.vx=p.vy=0;p.tongue=null;setH(24);AU.sfx('grab');return true}
 return false}
function startTongue(){const p=P;if(p.tongue||p.tcd>0)return;let dx=p.face,dy=0;if(IN.U){if(IN.L||IN.R){dx=p.face*0.72;dy=-0.72}else{dx=0;dy=-1}}
 p.tongue={dx,dy,len:0,out:true,held:null};AU.sfx('tongue')}
function updTongue(){const p=P,t=p.tongue;if(!t)return;if(p.st!=='n'){p.tongue=null;return}
 const [mx,my]=mouth();
 if(t.out){t.len+=9;if(t.len>=78){t.len=78;t.out=false}
  const tx=mx+t.dx*t.len,ty=my+t.dy*t.len;
  const tcx=Math.floor(tx/TS),tcy=Math.floor(ty/TS);
  if(SOLID.has(T(tcx,tcy))){t.out=false;if(T(tcx,tcy)==='?')bonkQ(tcx,tcy)}
  else{for(const it of LV.items)if(it.alive&&Math.abs(it.x-tx)<10&&Math.abs(it.y-ty)<10){t.held=it;it.alive=false;t.out=false;break}
   if(!t.held)for(const e of LV.enemies){if(!e.alive||!e.active)continue;if(tx>e.x-5&&tx<e.x+e.w+5&&ty>e.y-16&&ty<e.y+e.h+5){// -16: a standing lick reaches bugs/hyenas on the ground

     if(EDEF[e.type].eat){t.held={t:'e',e};e.alive=false}else{e.stun=110;AU.sfx('bonk');LV.pops.push({x:e.x+e.w/2,y:e.y-4,txt:'DIZZY!',life:40,col:'#bde'})}t.out=false;break}}
   if(!t.held&&LV.boss&&LV.boss.hp>0&&ov({x:tx-2,y:ty-2,w:4,h:4},LV.boss)){t.out=false;LV.pops.push({x:tx,y:ty-6,txt:'BLEH!',life:40,col:'#fdd'})}}}
 else{t.len-=11;if(t.len<=0){if(t.held)eatItem(t.held,mx,my-6);p.tongue=null;p.tcd=6}}}
function updPlayer(){const p=P;p.t++;if(p.inv>0)p.inv--;if(p.ramCD>0)p.ramCD--;if(p.tcd>0)p.tcd--;
 if(p.st==='dead'){p.dt++;if(p.dt>30){p.vy=Math.min(p.vy+0.3,7);p.y+=p.vy}if(p.dt>110)afterDeath();return}
 if(p.st==='win'){p.vx=0;p.walk+=0.1;return}
 if(PR.A)onAction();
 if(PR.RAM&&(p.st==='n'||p.st==='swing'))startRam();
 if(p.st==='n')normal();else if(p.st==='ram')doRam();else if(p.st==='ledge')doLedge();else if(p.st==='swing')doSwing();
 updTongue();
 if(p.st==='dead')return;
 // hazards
 if(p.y>LPX+8){fallOut();return}
 const x0=Math.floor(p.x/TS),x1=Math.floor((p.x+p.w-0.01)/TS),y0=Math.floor(p.y/TS),y1=Math.floor((p.y+p.h-0.01)/TS);
 for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){const t=T(cx,cy);
  if(t==='~'&&p.y+p.h>cy*TS+5){fallOut();return}
  if(t==='^'&&p.y+p.h>cy*TS+7&&p.st!=='ram'){hurt(false);if(p.st==='n'){p.vy=-5.2;p.ground=false}}}
 // items, flags, goal, signs
 for(const it of LV.items)if(it.alive&&Math.abs(it.x-(p.x+p.w/2))<11&&it.y>p.y-6&&it.y<p.y+p.h+6){it.alive=false;eatItem(it,it.x,it.y)}
 for(const f of LV.flags)if(!f.on&&ov(p,f)){f.on=true;LV.cp={x:f.x-1,y:f.y+f.h-24};AU.sfx('cp');LV.pops.push({x:f.x+5,y:f.y-6,txt:'CHECKPOINT!',life:60,col:'#aaffc0'})}
 if(LV.goal&&ov(p,LV.goal))levelClear();
 if(p.ground&&p.st==='n'&&solidAt(p.x+1,p.y+p.h+2)&&solidAt(p.x+p.w-1,p.y+p.h+2)&&!rectSolid(p.x,p.y,p.w,24)){if(++p.safeT>15)p.safe={x:p.x,y:p.y}}else p.safeT=0;
}
function normal(){const p=P,dir=IN.R-IN.L;

 p.drop=false;

  else{if(p.duck&&setH(24))p.duck=false;p.vy=-7.0;p.jbuf=0;p.coyote=0;p.ground=false;AU.sfx('jump')}}
 if(!IN.J&&p.vy<-2.5)p.vy+=0.55;
